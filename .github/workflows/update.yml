name: Update IPTV Playlist

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download playlist
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
        run: |
          curl -fLsS "$IPTV_URL" -o playlist.m3u
          test -s playlist.m3u
          head -n 1 playlist.m3u | grep -q '#EXTM3U'

      - name: Save changes
        run: |
          git config user.name "IPTV Updater"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --cached --quiet || (
            git commit -m "Update IPTV playlist"
            git push
          )
