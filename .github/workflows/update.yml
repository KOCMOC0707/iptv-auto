name: Update IPTV Playlist

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV playlist
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
        run: |
          set -e

          if [ -z "$IPTV_URL" ]; then
            echo "ERROR: IPTV_URL is empty"
            exit 1
          fi

          curl -L -f -sS \
            --connect-timeout 30 \
            --max-time 180 \
            -A "Mozilla/5.0" \
            "$IPTV_URL" \
            -o playlist.tmp

          if [ ! -s playlist.tmp ]; then
            echo "ERROR: Downloaded file is empty"
            exit 1
          fi

          if ! grep -q "#EXTM3U" playlist.tmp; then
            echo "ERROR: File is not a valid M3U playlist"
            exit 1
          fi

          mv playlist.tmp playlist.m3u
          echo "Playlist downloaded successfully"

      - name: Commit updated playlist
        run: |
          git config user.name "IPTV Updater"
          git config user.email "actions@github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist has not changed"
          else
            git commit -m "Automatic IPTV update"
            git push
          fi
